<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Grand Horizon HMS | Pro</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="app-wrapper">

    <!-- ========== SIDEBAR ========== -->
    <aside class="sidebar">

        <div class="brand">🏨 HMS PRO</div>

        <nav>
            <div class="nav-item active" onclick="router('dashboard',event)">Dashboard</div>
            <div class="nav-item" onclick="router('bookings',event)">Bookings</div>
            <div class="nav-item" onclick="router('inventory',event)">Inventory</div>
            <div class="nav-item" onclick="router('staff',event)">Staff</div>
            <div class="nav-item" onclick="router('billing',event)">Billing</div>
        </nav>

    </aside>


    <!-- ========== MAIN PANEL ========== -->
    <main class="main-panel">

        <header class="top-nav">
            <h2 id="view-title">Dashboard</h2>
            <div id="live-clock"></div>
        </header>

        <section id="app-viewport"></section>

    </main>

</div>


<!-- ================================================= -->
<!-- ================== TEMPLATES ==================== -->
<!-- ================================================= -->


<!-- ===== DASHBOARD ===== -->
<template id="tpl-dashboard">

    <div class="grid-stats">

        <div class="stat-card">
            <h3>Available Rooms</h3>
            <p id="stat-rooms">45</p>
        </div>

        <div class="stat-card">
            <h3>Active Guests</h3>
            <p id="stat-guests">12</p>
        </div>

        <div class="stat-card">
            <h3>Today's Revenue</h3>
            <p>$2,840</p>
        </div>

        <div class="stat-card">
            <h3>Pending Tasks</h3>
            <p>5</p>
        </div>

    </div>


    <div class="content-card">
        <h3>Recent Bookings</h3>

        <table class="data-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>Guest</th>
                <th>Room</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>
            <tr><td>1</td><td>Rahul</td><td>101</td><td>Checked In</td></tr>
            <tr><td>2</td><td>Priya</td><td>202</td><td>Reserved</td></tr>
            <tr><td>3</td><td>Arjun</td><td>305</td><td>Checked Out</td></tr>
            </tbody>
        </table>
    </div>

</template>



<!-- ===== BOOKINGS ===== -->
<template id="tpl-bookings">

    <div class="content-card">

        <h3>New Reservation</h3>

        <form id="booking-form" onsubmit="handleNewBooking(event)">

            <input type="text" id="guest" placeholder="Guest Name" required />

            <select id="room">
                <option value="101 (Standard)">101 (Standard)</option>
                <option value="202 (Deluxe)">202 (Deluxe)</option>
                <option value="305 (Suite)">305 (Suite)</option>
            </select>

            <button type="submit" class="btn-add">Confirm Booking</button>

        </form>


        <table class="data-table">

            <thead>
            <tr>
                <th>ID</th>
                <th>Guest</th>
                <th>Room</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody id="list-bookings"></tbody>

        </table>

    </div>

</template>



<!-- ===== INVENTORY ===== -->
<template id="tpl-inventory">

    <div class="content-card">

        <h3>Supply Management</h3>

        <div class="inv-item">
            <span>Linens</span>
            <div class="meter"><span style="width:85%"></span></div>
        </div>

        <div class="inv-item">
            <span>Cleaning Agents</span>
            <div class="meter"><span style="width:40%" class="low"></span></div>
        </div>

        <div class="inv-item">
            <span>Mini Bar Stock</span>
            <div class="meter"><span style="width:60%"></span></div>
        </div>

    </div>

</template>



<!-- ===== STAFF ===== -->
<template id="tpl-staff">

    <div class="content-card">

        <button class="btn-add" onclick="addMockStaff()">Hire New Staff</button>

        <div class="staff-grid" id="list-staff"></div>

    </div>

</template>



<!-- ===== BILLING ===== -->
<template id="tpl-billing">

    <div class="content-card">

        <h3>Terminal POS</h3>

        <p>Select guest → generate invoice</p>

        <div class="billing-actions">
            <button class="btn-add">Generate Bill</button>
        </div>

    </div>

</template>



<!-- JS -->
<script src="script.js"></script>

</body>
</html>
